services:
  mysql:
    image: mysql:8.4
    container_name: bna-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bna_digital_banking}
      MYSQL_USER: ${MYSQL_USER:-bna_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bna_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
